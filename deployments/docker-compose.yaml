version: "3.8"

services:
    redis:
        image: redis:7-alpine
        ports:
            - "6379:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 5

    sanguis-server:
        build:
            context: ..
            dockerfile: deployments/Dockerfile
        ports:
            - "50051:50051"
            - "9090:9090"
        depends_on:
            redis:
                condition: service_healthy
        environment:
            - REDIS_ADDRESS=redis:6379
            - LIMITER_TYPE=hybrid

